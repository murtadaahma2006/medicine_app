workflows:
  ios-unsigned-build:
    name: iOS Unsigned Build for Sideloading (iPad)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
        
      - name: Force Disable iOS Code Signing (Patching Xcode)
        script: |
          # 1. حقن أوامر إيقاف التوقيع مباشرة في ملفات إعدادات فلاتر
          echo "CODE_SIGNING_REQUIRED = NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_ALLOWED = NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY = \"\"" >> ios/Flutter/Release.xcconfig
          echo "EXPANDED_CODE_SIGN_IDENTITY = \"\"" >> ios/Flutter/Release.xcconfig
          
          # 2. تعديل ملف مشروع Xcode برمجياً لتحويل التوقيع من تلقائي إلى يدوي وتفريغه
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' ios/Runner.xcodeproj/project.pbxproj
          
      - name: Build unsigned iOS app
        script: flutter build ios --release --no-codesign
        
      - name: Package to IPA
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -qr ../../../medicine_app.ipa Payload
          rm -rf Payload
          
    artifacts:
      - medicine_app.ipa
