workflows:
  ios-unsigned-build:
    name: iOS Unsigned Build for Sideloading (iPad)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
        
      - name: Obliterate Apple Code Signing (Ruby Script)
        script: |
          # تنزيل مكتبة xcodeproj للتحكم بملفات آبل برمجياً
          gem install xcodeproj
          
          ruby -e "
          require 'xcodeproj'
          
          # 1. تنظيف مشروعك الأساسي من أي مطالبات بالتوقيع
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          project.root_object.attributes['TargetAttributes']&.each do |target_id, attributes|
            attributes.delete('DevelopmentTeam')
          end
          
          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
              config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
              config.build_settings['CODE_SIGN_IDENTITY'] = ''
              config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
              config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
              config.build_settings.delete('DEVELOPMENT_TEAM')
              config.build_settings.delete('PROVISIONING_PROFILE_SPECIFIER')
            end
          end
          project.save
          
          # 2. حقن أوامر تعطيل التوقيع داخل مكاتب CocoaPods (Podfile)
          podfile_path = 'ios/Podfile'
          if File.exist?(podfile_path)
            content = File.read(podfile_path)
            hook = %Q{
                  target.build_configurations.each do |config|
                    config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                    config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                  end
            }
            content.gsub!(/flutter_additional_ios_build_settings\(target\)/, %Q{flutter_additional_ios_build_settings(target)\n#{hook}})
            File.write(podfile_path, content)
          end
          "
          
      - name: Build unsigned iOS app
        script: flutter build ios --release --no-codesign
        
      - name: Package to IPA
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -qr ../../../medicine_app.ipa Payload
          rm -rf Payload
          
    artifacts:
      - medicine_app.ipa
