workflows:
  ios-unsigned-build:
    name: iOS Unsigned Build for Sideloading (iPad)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
        
      - name: Build unsigned iOS app
        script: |
          # إجبار بيئة Xcode على تخطي التوقيع بالكامل
          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGNING_REQUIRED=NO
          export CODE_SIGN_IDENTITY=""
          
          # البناء بنسخة الريليز بدون توقيع
          flutter build ios --release --no-codesign
          
      - name: Package to IPA
        script: |
          # الانتقال لمسار بناء التطبيق
          cd build/ios/iphoneos
          
          # إنشاء مجلد Payload المطلوب لصيغة IPA
          mkdir -p Payload
          mv Runner.app Payload/
          
          # ضغط الملف ونقله للمسار الرئيسي للمشروع
          zip -qr ../../../medicine_app.ipa Payload
          
          # تنظيف الملفات المؤقتة
          rm -rf Payload
          
    artifacts:
      - medicine_app.ipa
