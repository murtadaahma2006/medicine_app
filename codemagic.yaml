workflows:
  ios-unsigned-build:
    name: iOS Unsigned Build for Sideloading (iPad)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
        
      - name: Generate Flutter Configs
        script: |
          # 1. نجعل فلاتر يجهز الملفات، ويدمج المكاتب، ويحضر الأكواد
          # نضيف (|| true) في النهاية لنتجاهل خطأ التوقيع الذي سيظهر ونستمر في العمل
          flutter build ios --release --no-codesign || true
          
      - name: Native Xcode Build (Unsigned)
        script: |
          # 2. نقوم ببناء التطبيق باستخدام محرك آبل مباشرة مع أوامر قمع التوقيع بالقوة
          cd ios
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            SYMROOT="${PWD}/../build/ios"
            
      - name: Package to IPA
        script: |
          # 3. تغليف التطبيق الناتج إلى صيغة IPA ليقبله AltStore أو Sideloadly
          cd build/ios/Release-iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -qr ../../../medicine_app.ipa Payload
          rm -rf Payload
          
    artifacts:
      - medicine_app.ipa
