workflows:
  ios-unsigned-build:
    name: iOS Unsigned Build for Sideloading (iPad)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Build unsigned iOS app
        script: flutter build ios --release --no-codesign
      - name: Package to IPA
        script: |
          # Go to the directory where Runner.app is generated
          cd build/ios/iphoneos
          
          # Create the required Payload folder structure for an IPA
          mkdir -p Payload
          mv Runner.app Payload/
          
          # Compress the Payload directory into an .ipa file and place it in the root build dir
          zip -qr ../../../medicine_app.ipa Payload
          
          # Clean up the Payload folder
          rm -rf Payload
    artifacts:
      - medicine_app.ipa
