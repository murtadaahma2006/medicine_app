name: medicine_app
description: >-
  منصة الطب الباطني — تطبيق دراسة الطب الباطني (شروحات، بطاقات SRS،
  أسئلة MCQ، وحالات سريرية). يعمل محلياً بالكامل (100% Offline).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  file_picker: ^8.3.7
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.5.0
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.17
  go_router: ^14.8.1
  home_widget: ^0.7.0
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  shared_preferences: ^2.5.2
  sqflite: ^2.4.1
  timezone: ^0.10.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.4

# ملاحظة معمارية — الخطوط:
# Cairo للعربية وNunito للمصطلحات الطبية اللاتينية — ملفات TTF مدمجة
# مباشرة (أخف وأضمن للعمل أوفلاين 100%).
flutter:
  uses-material-design: true

  assets:
    - assets/content/
    - assets/fonts/
    - assets/brand/icon/
    - assets/brand/final/
    - assets/icons/nav/
    - assets/icons/units/
    - assets/icons/badges/
    - assets/icons/empty/
    - assets/illustrations/onboarding/
    - assets/illustrations/empty/
    - assets/illustrations/badges/
    - assets/illustrations/levels/
    - assets/illustrations/misc/
    - docs/schemas/
    - docs/باطنية.txt
    - docs/جراحة.txt
    - docs/نسائية.txt
    - assets/data/

  fonts:
    # العربية — Cairo (خط تعليمي عربي حديث واضح على الشاشات)
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
    # اللاتينية — Nunito (للمصطلحات الطبية الإنجليزية)
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
    # خط القراءة العميقة — Atkinson Hyperlegible (أشكال حروف لاتينية
    # متمايزة جذرياً: i/l/1، 0/O — مصمم مختبرياً لسوء القراءة).
    # لنصوص الشروحات الإنجليزية الطويلة فقط. رخصة OFL مفتوحة.
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/atkinson/AtkinsonHyperlegible-Regular.ttf
          weight: 400
        - asset: assets/fonts/atkinson/AtkinsonHyperlegible-Bold.ttf
          weight: 700

# توليد أيقونات المشروع (أندرويد/iOS) من ملف واحد.
# تشغيل: flutter pub get ثم dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/brand/icon/app_icon_new.png"
  adaptive_icon_background: "#152047"
  adaptive_icon_foreground: "assets/brand/icon/app_icon_foreground_new.png"
