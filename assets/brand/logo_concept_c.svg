<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Soft Royal Slate Background -->
  <rect width="512" height="512" rx="120" fill="url(#bg_slate)"/>

  <!-- Infinity Ribbon forming D (Deutsch) and A (Arabisch) -->
  <path d="M180 140 C280 140 360 190 360 256 C360 322 280 372 180 372 C120 372 120 140 180 140 Z" stroke="url(#loop_gold)" stroke-width="36" stroke-linecap="round" fill="none"/>
  
  <!-- Interlocking Diagonal "A" Bridge -->
  <path d="M180 140 L340 372" stroke="url(#loop_emerald)" stroke-width="28" stroke-linecap="round"/>
  <path d="M210 270 H300" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>

  <!-- Gradients -->
  <defs>
    <linearGradient id="bg_slate" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.5" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="loop_gold" x1="120" y1="140" x2="360" y2="372" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#D4AF37"/>
    </linearGradient>

    <linearGradient id="loop_emerald" x1="180" y1="140" x2="340" y2="372" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981"/>
      <stop offset="1" stop-color="#065F46"/>
    </linearGradient>
  </defs>
</svg>
