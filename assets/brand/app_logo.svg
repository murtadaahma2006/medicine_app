<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Deep Midnight Blue Shield Background -->
  <rect width="512" height="512" rx="120" fill="url(#bg_midnight)"/>

  <!-- Dynamic Chevron Arrow 1 (German D Curve) -->
  <path d="M160 120 L270 256 L160 392 H230 L340 256 L230 120 H160 Z" fill="url(#neon_blue)"/>
  
  <!-- Dynamic Chevron Arrow 2 (Forward Growth Accent) -->
  <path d="M240 120 L350 256 L240 392 H310 L420 256 L310 120 H240 Z" fill="url(#bright_gold)"/>

  <!-- Pulse Dot Node -->
  <circle cx="160" cy="256" r="24" fill="#10B981"/>

  <!-- Gradients -->
  <defs>
    <linearGradient id="bg_midnight" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050B14"/>
      <stop offset="0.5" stop-color="#0A1628"/>
      <stop offset="1" stop-color="#14243E"/>
    </linearGradient>

    <linearGradient id="neon_blue" x1="160" y1="120" x2="340" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="bright_gold" x1="240" y1="120" x2="420" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FDE047"/>
    </linearGradient>
  </defs>
</svg>
