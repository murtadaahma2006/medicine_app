<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- الرثوية: مفصل ركبة بأسلوب ودود — عظمتان تلتقيان + أقواس ألم تشع وتخفت -->
  <!-- عظمة الفخذ -->
  <path d="M15 8.5c0 2.5 1.5 4 3.5 4.5l4 1c1.5.4 2.5 1.5 3 3l1.5 4.5"
        stroke="#1B3C6E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
        fill="none"/>
  <circle cx="14.5" cy="7" r="2.2" stroke="#1B3C6E" stroke-width="1.8" fill="#1B3C6E" fill-opacity="0.1"/>
  <!-- عظمة الظنبوب -->
  <path d="M28.5 24.5c1.2 3.5.8 7-1 10l-1 2.5c-.6 1.5-2 2.5-3.6 2.5h-2"
        stroke="#1B3C6E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="19" cy="40" r="2.2" stroke="#1B3C6E" stroke-width="1.8" fill="#1B3C6E" fill-opacity="0.1"/>
  <!-- فرشاة الغضروف (meniscus) بلون التخصص -->
  <path d="M26.5 21.5c-2.2-.6-4.5 0-6.2 1.6-1.4 1.3-2.2 3-2.4 4.9"
        stroke="#1FA8A0" stroke-width="1.8" stroke-linecap="round"/>
  <!-- أقواس الألم المشعة — تخفت نحو الخارج -->
  <path d="M33 15.5c2.5-2.5 6-3.5 9.5-3" stroke="#1FA8A0" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M34.5 20c2.8-.8 5.5-.5 8 .8" stroke="#1FA8A0" stroke-width="1.4" stroke-linecap="round" opacity="0.65"/>
  <path d="M35 24.5c2.5.5 4.8 1.8 6.5 3.8" stroke="#1FA8A0" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
</svg>
