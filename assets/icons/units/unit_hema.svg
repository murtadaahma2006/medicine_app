<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- الدم: قطرة كبيرة تحوي ثلاث خلايا (ترقصة دونات + كرتان) + تموج نبض -->
  <path d="M24 6.5C18 14 12.5 20.5 12.5 27.5c0 7.5 5.2 13 11.5 13s11.5-5.5 11.5-13C35.5 20.5 30 14 24 6.5Z"
        stroke="#1B3C6E" stroke-width="1.8" stroke-linejoin="round"
        fill="#1B3C6E" fill-opacity="0.1"/>
  <!-- خلية ترقصة (donut platelet) -->
  <circle cx="20" cy="24" r="3.6" stroke="#B33939" stroke-width="1.8"/>
  <circle cx="20" cy="24" r="1.1" fill="#B33939"/>
  <!-- كريتان حمراء -->
  <circle cx="27.5" cy="27" r="3" stroke="#B33939" stroke-width="1.8"/>
  <circle cx="24.5" cy="32" r="2.4" stroke="#B33939" stroke-width="1.8" opacity="0.8"/>
  <!-- تموج النبض حول القطرة -->
  <path d="M8.5 27.5c1.2-1 2.4-1 3.5 0" stroke="#B33939" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M36 27.5c1.2-1 2.4-1 3.5 0" stroke="#B33939" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
</svg>
