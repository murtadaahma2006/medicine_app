<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- تميمة «العقل المرتاح»: دماغ ودود نائم يحتضن بطاقاته كوسادة -->
  <defs>
    <linearGradient id="bgSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B3C6E" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#1B3C6E" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="62" r="46" fill="url(#bgSoft)"/>

  <!-- بطاقات SRS كوسادة تحت الدماغ -->
  <rect x="34" y="72" width="52" height="30" rx="6" fill="#FFFFFF"
